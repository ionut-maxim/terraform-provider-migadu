# Build, lint, check generated docs and run the acceptance tests on every pull
# request and push. The tools and steps are the mise.toml tasks, so
# `mise run build|lint|generate|testacc` locally does the same.
name: Tests

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        env:
          MISE_LOCKED: "1" # install only what mise.lock records, checksums included
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.11.8 # reads mise.lock's format (older mise can't)
      - run: mise run build
      - run: mise run lint

  generate:
    name: Generated docs are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        env:
          MISE_LOCKED: "1" # install only what mise.lock records, checksums included
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.11.8 # reads mise.lock's format (older mise can't)
      - run: mise run generate
      - name: No changes after generating
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Generated files are out of date: run 'mise run generate' and commit."; exit 1)

  test:
    name: 'Acceptance Tests: Terraform ${{ matrix.terraform }}'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Older Terraform versions than mise.toml's, which users still run.
        terraform:
          - '1.13.*'
          - '1.14.*'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        env:
          MISE_LOCKED: "1" # install only what mise.lock records, checksums included
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.11.8 # reads mise.lock's format (older mise can't)
          install_args: go
      # Not from mise: the matrix needs Terraform versions mise.lock doesn't hold.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Acceptance tests
        env:
          TF_ACC: "1"
        run: go test -v -cover ./internal/provider/
        timeout-minutes: 10
